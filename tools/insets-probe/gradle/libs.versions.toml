[versions]
agp = "9.0.1"
# Pinned to versions compatible with AGP 9.0.1 / compileSdk 36 (newer ones need AGP 9.1 + compileSdk 37).
coreKtx = "1.17.0"
activityKtx = "1.11.0"
window = "1.5.0"
# Must match the Kotlin Gradle plugin bundled with AGP 9.0.1.
kotlin = "2.2.10"
composeBom = "2025.12.01"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-activity-ktx = { group = "androidx.activity", name = "activity-ktx", version.ref = "activityKtx" }
androidx-window = { group = "androidx.window", name = "window", version.ref = "window" }
androidx-window-java = { group = "androidx.window", name = "window-java", version.ref = "window" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityKtx" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-foundation = { group = "androidx.compose.foundation", name = "foundation" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
