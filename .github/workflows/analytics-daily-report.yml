name: Analytics daily report

on:
  schedule:
    # 00:00 UTC = 09:00 KST. GitHub may start scheduled runs late.
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      report_date:
        description: "Optional completed GA4 reporting date (YYYY-MM-DD); empty uses yesterday"
        required: false
        type: string

# A queued/manual run must finish its delivery record before another sender starts.
concurrency:
  group: analytics-daily-report
  cancel-in-progress: false
  queue: max

permissions:
  contents: read

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      report: ${{ steps.report.outputs.daily_report }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Restore GitHub stars snapshots
        id: stars-cache
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/cache/restore@v4
        with:
          path: .analytics/github-stars.json
          key: github-stars-${{ github.repository }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: github-stars-${{ github.repository }}-
      - id: report
        run: node scripts/analytics-daily-report.mjs
        env:
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
          GA4_SERVICE_ACCOUNT_KEY: ${{ secrets.GA4_SERVICE_ACCOUNT_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          REPORT_DATE: ${{ inputs.report_date }}
      - name: Save GitHub stars snapshots
        if: always() && steps.report.outputs.stars_snapshot_saved == 'true'
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/cache/save@v4
        with:
          path: .analytics/github-stars.json
          key: github-stars-${{ github.repository }}-${{ github.run_id }}-${{ github.run_attempt }}

  deliver:
    needs: prepare
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      # Only this isolated sender gets Contents write; the token is still repo-wide.
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            scripts/send-daily-report.mjs
            scripts/report-delivery.mjs
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Claim, send, and save the Discord receipt
        run: node scripts/send-daily-report.mjs
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GITHUB_TOKEN: ${{ github.token }}
          REPORT_JSON: ${{ needs.prepare.outputs.report }}
